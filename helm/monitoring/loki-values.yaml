loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

singleBinary:
  replicas: 1

promtail:
  enabled: true
  serviceMonitor:
    enabled: false

  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
    snippets:
      extraScrapeConfigs: |
        - job_name: containers
          static_configs:
            - targets:
                - localhost
              labels:
                job: varlogs
                __path__: /var/log/containers/*.log
