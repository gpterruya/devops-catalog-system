grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
      - grafana.localdev
    paths:
      - /
    pathType: Prefix

prometheus:
  service:
    type: ClusterIP

  prometheusSpec:
    scrapeInterval: 15s
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
